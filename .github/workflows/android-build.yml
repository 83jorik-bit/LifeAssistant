name: Android CI

# Собирает debug-APK при каждом push/PR в main, и по кнопке вручную (workflow_dispatch).
# Ключ Yandex MapKit берётся из GitHub Secrets — в репозитории он никогда не хранится.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create local.properties with API keys
        run: |
          echo "MAPKIT_API_KEY=${{ secrets.MAPKIT_API_KEY }}" > local.properties
          echo "RASP_API_KEY=${{ secrets.RASP_API_KEY }}" >> local.properties
          # Вход через внешние ID. Если секреты не заданы, значения останутся пустыми
          # и кнопки входа будут показаны неактивными — сборка при этом не ломается.
          echo "YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }}" >> local.properties
          echo "VK_CLIENT_ID=${{ secrets.VK_CLIENT_ID }}" >> local.properties
          echo "YANDEX_REDIRECT_URI=${{ secrets.YANDEX_REDIRECT_URI }}" >> local.properties
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> local.properties
          echo "VK_REDIRECT_URI=${{ secrets.VK_REDIRECT_URI }}" >> local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
