name: Cleanup build history

on:
  # Daily cleanup; can also be started manually from the Actions tab.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: cleanup-build-history
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove workflow runs and debug releases older than 24 hours
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const maxAgeMs = 24 * 60 * 60 * 1000;
            const now = Date.now();

            // Delete only completed workflow runs older than 24 hours.
            // Recent runs are retained regardless of how many exist.
            const runs = [];
            for (let page = 1; page <= 20; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 100, page
              });
              runs.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }

            let deletedRuns = 0;
            for (const run of runs) {
              if (run.status !== "completed") continue;
              const ageMs = now - Date.parse(run.created_at);
              if (ageMs <= maxAgeMs) continue;

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deletedRuns++;
                core.info(`Deleted Actions run ${run.id}: age=${Math.round(ageMs / 3600000)}h`);
              } catch (error) {
                core.warning(`Could not delete Actions run ${run.id}: ${error.message}`);
              }
            }

            // Apply the same 24-hour rule only to debug prereleases.
            // Production releases are never touched.
            const { data: allReleases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100
            });
            const debugReleases = allReleases.filter(
              release => release.prerelease && /^debug-\\d+$/.test(release.tag_name)
            );

            let deletedReleases = 0;
            for (const release of debugReleases) {
              const ageMs = now - Date.parse(release.created_at);
              if (ageMs <= maxAgeMs) continue;

              try {
                await github.rest.repos.deleteRelease({
                  owner, repo, release_id: release.id
                });
                try {
                  await github.rest.git.deleteRef({
                    owner, repo, ref: `tags/${release.tag_name}`
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                deletedReleases++;
                core.info(`Deleted debug release ${release.tag_name}: age=${Math.round(ageMs / 3600000)}h`);
              } catch (error) {
                core.warning(`Could not delete debug release ${release.tag_name}: ${error.message}`);
              }
            }

            core.notice(`Daily cleanup complete. Deleted ${deletedRuns} workflow runs and ${deletedReleases} debug releases older than 24 hours.`);
