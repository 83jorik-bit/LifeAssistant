name: Cleanup build history

on:
  # Daily cleanup and manual run. A workflow-file change also triggers one cleanup
  # so retention policy updates can be applied immediately without another build.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/cleanup-build-history.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: cleanup-build-history
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove excess build artifacts and old run records while keeping recent builds
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepRunRecords = 10;
            const keepArtifacts = 5;
            const maxAgeMs = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const buildWorkflowNames = new Set(["Android CI", "Release for RuStore"]);

            const runs = [];
            for (let page = 1; page <= 20; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 100, page
              });
              runs.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }

            const completedRuns = runs
              .filter(run => run.status === "completed" && buildWorkflowNames.has(run.name))
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            // Keep 10 run records for history, independently from APK artifact retention.
            const keepRunIds = new Set(completedRuns.slice(0, keepRunRecords).map(run => run.id));

            // Preserve downloadable artifacts only for the 5 newest successful main-branch builds.
            // This caps the expected APK footprint at roughly 5 x 76 MiB.
            const successfulMainBuilds = completedRuns.filter(run =>
              run.head_branch === "main" && run.conclusion === "success"
            );
            const keepArtifactRunIds = new Set(
              successfulMainBuilds.slice(0, keepArtifacts).map(run => run.id)
            );

            let deletedArtifacts = 0;
            let deletedRuns = 0;

            for (const run of completedRuns) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner, repo, run_id: run.id, per_page: 100
                });

                if (!keepArtifactRunIds.has(run.id)) {
                  for (const artifact of data.artifacts) {
                    try {
                      await github.rest.actions.deleteArtifact({
                        owner, repo, artifact_id: artifact.id
                      });
                      deletedArtifacts++;
                      core.info(`Deleted artifact ${artifact.name} from run ${run.run_number}`);
                    } catch (error) {
                      core.warning(`Could not delete artifact ${artifact.id}: ${error.message}`);
                    }
                  }
                }
              } catch (error) {
                core.warning(`Could not inspect artifacts for run ${run.id}: ${error.message}`);
              }

              const ageMs = now - Date.parse(run.created_at);
              if (ageMs <= maxAgeMs || keepRunIds.has(run.id)) continue;

              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deletedRuns++;
              } catch (error) {
                core.warning(`Could not delete workflow run ${run.id}: ${error.message}`);
              }
            }

            // Keep the 10 newest debug prereleases; never touch production releases.
            const { data: allReleases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100
            });
            const debugReleases = allReleases
              .filter(release => release.prerelease && new RegExp("^debug-[0-9]+$").test(release.tag_name))
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            let deletedReleases = 0;
            for (const [index, release] of debugReleases.entries()) {
              const ageMs = now - Date.parse(release.created_at);
              if (ageMs <= maxAgeMs || index < keepRunRecords) continue;

              try {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                deletedReleases++;
              } catch (error) {
                core.warning(`Could not delete debug release ${release.tag_name}: ${error.message}`);
              }
            }

            core.notice(`Cleanup complete. Kept ${Math.min(completedRuns.length, keepRunRecords)} run records and ${Math.min(successfulMainBuilds.length, keepArtifacts)} downloadable build artifacts; deleted ${deletedArtifacts} artifacts, ${deletedRuns} old run records, and ${deletedReleases} debug releases.`);
