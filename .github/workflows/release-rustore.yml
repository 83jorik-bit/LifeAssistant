name: Release for RuStore

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (integer; must increase for every release)'
        required: true
        default: '1'
      version_name:
        description: 'versionName, for example 1.0.0'
        required: true
        default: '1.0.0'
      publish:
        description: 'Upload the built package to RuStore as a draft'
        type: boolean
        default: false
      artifact_type:
        description: 'Package to upload'
        type: choice
        options: [apk, aab]
        default: apk
      send_to_moderation:
        description: 'Submit the draft for moderation/publication'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate required release secrets
        if: ${{ inputs.publish }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        shell: bash
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_STORE_PASSWORD" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$RUSTORE_KEY_ID" ] && missing="$missing RUSTORE_KEY_ID"
          [ -z "$RUSTORE_PRIVATE_KEY" ] && missing="$missing RUSTORE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing required GitHub Secrets:$missing" >&2
            exit 1
          fi

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Configure non-secret application values
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          YANDEX_REDIRECT_URI: ${{ secrets.YANDEX_REDIRECT_URI }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          YANDEX_GPT_FOLDER_ID: ${{ secrets.YANDEX_GPT_FOLDER_ID }}
        shell: bash
        run: |
          {
            printf 'MAPKIT_API_KEY=%s\n' "$MAPKIT_API_KEY"
            printf 'YANDEX_CLIENT_ID=%s\n' "$YANDEX_CLIENT_ID"
            printf 'VK_CLIENT_ID=%s\n' "$VK_CLIENT_ID"
            printf 'YANDEX_REDIRECT_URI=%s\n' "$YANDEX_REDIRECT_URI"
            printf 'BACKEND_BASE_URL=%s\n' "$BACKEND_BASE_URL"
            printf 'YANDEX_GPT_FOLDER_ID=%s\n' "$YANDEX_GPT_FOLDER_ID"
          } > local.properties
          chmod 600 local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed AAB and APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: gradle bundleRelease assembleRelease

      - name: Verify release signing
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if ! unzip -l "$APK" | grep -qiE "META-INF/.*\.(RSA|DSA|EC)$"; then
            echo "Release APK appears unsigned; refusing to publish." >&2
            exit 1
          fi
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK" | grep -iE "SHA256|Owner"

      - name: Publish to RuStore
        if: ${{ inputs.publish }}
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          PACKAGE_NAME: com.lifenavigator.app
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          ARTIFACT_PATH: ${{ inputs.artifact_type == 'aab' && 'app/build/outputs/bundle/release/app-release.aab' || 'app/build/outputs/apk/release/app-release.apk' }}
          SEND_TO_MODERATION: ${{ inputs.send_to_moderation }}
        run: bash scripts/rustore-publish.sh

      - name: Upload artifacts for RuStore
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: rustore-release-${{ inputs.version_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary secrets from runner
        if: always()
        shell: bash
        run: |
          rm -f release.keystore private_key.pem local.properties
