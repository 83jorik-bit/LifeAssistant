version: "3.8"

services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - backend-data:/data
    expose:
      - "3000"

  # Caddy сам получает и обновляет сертификат Let's Encrypt по домену из Caddyfile —
  # руками openssl/certbot дёргать не нужно. Замените домен в Caddyfile на свой
  # перед первым запуском.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  backend-data:
  caddy-data:
  caddy-config:
