services:
  lifeassistant-server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /var/lib/lifeassistant/app.db
    # Keep the application port on loopback. Put an HTTPS reverse proxy in front
    # before setting BACKEND_BASE_URL to a public domain.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lifeassistant-data:/var/lib/lifeassistant
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lifeassistant-data:
